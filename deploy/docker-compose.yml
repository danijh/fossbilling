name: sangatta-cloud-staging

services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set MARIADB_DATABASE in deploy/.env}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER in deploy/.env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BILLING_BIND_IP:-192.168.1.22}:8085:80"
    volumes:
      - fossbilling_data:/var/www/html/data

volumes:
  mariadb_data:
  fossbilling_data:
